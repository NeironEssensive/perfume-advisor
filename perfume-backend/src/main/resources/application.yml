spring:
  application:
    name: perfume-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/perfume_advisor
    username: perfume
    password: perfume
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}

perfume:
  import:
    enabled: false
    csv-path: data/fragrantica_dataset.csv
  scoring:
    enabled: false
