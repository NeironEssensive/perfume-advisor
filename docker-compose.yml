services:
  postgres:
    image: postgres:16-alpine
    container_name: perfume-postgres
    environment:
      POSTGRES_DB: perfume_advisor
      POSTGRES_USER: perfume
      POSTGRES_PASSWORD: perfume
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perfume"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: perfume-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
